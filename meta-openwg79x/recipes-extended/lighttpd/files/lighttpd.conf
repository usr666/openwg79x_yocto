server.modules = ( "mod_access", "mod_alias", "mod_redirect", "mod_dirlisting", "mod_webdav", "mod_wstunnel", "mod_openssl" )

server.document-root = "/usr/share/openwg79x-rc/www/"
server.errorlog = "/var/log/lighttpd.error.log"
index-file.names = ( "mowermap.html" )

server.port = 80
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/data/etc/lighttpd/server.crt"
    ssl.privkey = "/data/etc/lighttpd/server.key"
}
$HTTP["scheme"] == "http" {
    url.redirect = ( "" => "https://${url.authority}${url.path}${qsa}" )
}

mimetype.assign = (
    ".html" => "text/html",
    ".js" => "text/javascript",
    ".css" => "text/css",
    ".json" => "application/json",
    ".png" => "image/png",
    ".jpg" => "image/jpeg",
    ".csv" => "text/csv",
    ".wo" => "text/plain",
    "" => "application/octet-stream"
)

alias.url = (
    "/worklogs/" => "/var/log/openwg79x_rc/",
    "/workorder/" => "/data/openwg79x_rc/workorder/",
    "/layers/" => "/data/openwg79x_rc/layers/"
)

$HTTP["url"] =~ "^/(worklogs|workorder|layers)/" {
    dir-listing.activate = "enable"
}
$HTTP["url"] =~ "^/workorder/" {
    webdav.activate = "enable"
}
$HTTP["url"] == "/webbsoket" {
    wstunnel.server = ( "" => (( "host" => "127.0.0.1", "port" => 32000 )) )
    wstunnel.frame-type = "binary"
}
